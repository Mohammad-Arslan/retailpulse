# =============================================================================
# RetailPulse — production Nginx site (host reverse proxy)
#
# Install:
#   sudo cp docker/nginx/retailpulse.conf /etc/nginx/sites-available/retailpulse
#   sudo cp docker/nginx/snippets/*.conf /etc/nginx/snippets/
#   sudo ln -sf /etc/nginx/sites-available/retailpulse /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d erp.example.com \
#     -d portainer.example.com -d jenkins.example.com \
#     -d status.example.com -d grafana.example.com
#
# Replace erp.example.com / sibling hostnames before enabling.
# All upstreams bind 127.0.0.1 only (see docker-compose*.yml).
# =============================================================================

# ---------------------------------------------------------------------------
# Rate-limit zones (http context — must live in this file's top when included
# from sites-enabled, OR move into /etc/nginx/nginx.conf http{} block).
# If nginx -t complains about duplicate zones, define them once in nginx.conf.
# ---------------------------------------------------------------------------
limit_req_zone $binary_remote_addr zone=rp_general:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=rp_login:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=rp_ops:10m rate=10r/s;
limit_conn_zone $binary_remote_addr zone=rp_conn:10m;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# ---------------------------------------------------------------------------
# Upstreams — keepalive to FrankenPHP/Octane is important for performance
# ---------------------------------------------------------------------------
upstream retailpulse_app {
    server 127.0.0.1:8000;
    keepalive 32;
}

upstream retailpulse_reverb {
    server 127.0.0.1:8080;
    keepalive 16;
}

upstream retailpulse_portainer {
    server 127.0.0.1:9010;
    keepalive 8;
}

upstream retailpulse_jenkins {
    server 127.0.0.1:9080;
    keepalive 8;
}

upstream retailpulse_uptime_kuma {
    server 127.0.0.1:3001;
    keepalive 4;
}

upstream retailpulse_grafana {
    server 127.0.0.1:3000;
    keepalive 8;
}

# =============================================================================
# Main application — erp.example.com
# =============================================================================
server {
    listen 80;
    listen [::]:80;
    server_name erp.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    # HTTP/3 (requires nginx with http_v3_module + QUIC; comment out if unsupported)
    # listen 443 quic reuseport;
    # listen [::]:443 quic reuseport;
    # add_header Alt-Svc 'h3=":443"; ma=86400' always;

    server_name erp.example.com;

    # ssl_certificate     /etc/letsencrypt/live/erp.example.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/erp.example.com/privkey.pem;
    include snippets/retailpulse-ssl.conf;
    include snippets/retailpulse-security-headers.conf;

    # Request size — imports, attachments, media uploads
    client_max_body_size 64m;
    client_body_buffer_size 128k;
    client_body_timeout 60s;
    client_header_timeout 30s;

    # Buffering — protect Octane from slow clients
    proxy_buffering on;
    proxy_buffer_size 16k;
    proxy_buffers 32 16k;
    proxy_busy_buffers_size 32k;
    proxy_request_buffering on;

    # Compression (skip already-compressed / streaming)
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_vary on;
    gzip_types
        text/plain text/css text/xml application/json application/javascript
        application/xml application/rss+xml image/svg+xml
        font/woff2 application/vnd.ms-fontobject;

    limit_conn rp_conn 40;
    limit_req zone=rp_general burst=60 nodelay;

    # Static Vite assets — long cache (hashed filenames)
    location ^~ /build/ {
        proxy_http_version 1.1;
        include snippets/retailpulse-proxy-params.conf;
        proxy_pass http://retailpulse_app;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include snippets/retailpulse-security-headers.conf;
    }

    # Auth / login — tighter rate limit
    location ~* ^/(login|register|forgot-password|reset-password|two-factor) {
        limit_req zone=rp_login burst=10 nodelay;
        proxy_http_version 1.1;
        include snippets/retailpulse-proxy-params.conf;
        proxy_pass http://retailpulse_app;
        proxy_read_timeout 60s;
    }

    # Laravel Reverb / Echo WebSockets — MUST stay unbuffered
    location /app/ {
        proxy_http_version 1.1;
        include snippets/retailpulse-proxy-params.conf;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_pass http://retailpulse_reverb;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        proxy_buffering off;
        proxy_request_buffering off;
    }

    # Horizon dashboard (auth gated in Laravel)
    location ^~ /horizon {
        proxy_http_version 1.1;
        include snippets/retailpulse-proxy-params.conf;
        proxy_pass http://retailpulse_app;
        proxy_read_timeout 120s;
    }

    location / {
        proxy_http_version 1.1;
        include snippets/retailpulse-proxy-params.conf;
        # FrankenPHP/Octane keepalive
        proxy_set_header Connection "";
        proxy_pass http://retailpulse_app;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}

# =============================================================================
# Portainer — portainer.example.com
# =============================================================================
server {
    listen 80;
    listen [::]:80;
    server_name portainer.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name portainer.example.com;

    # ssl_certificate     /etc/letsencrypt/live/portainer.example.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/portainer.example.com/privkey.pem;
    include snippets/retailpulse-ssl.conf;
    include snippets/retailpulse-security-headers.conf;

    # Optional IP allowlist — uncomment and set office/VPN CIDRs
    # allow 203.0.113.0/24;
    # deny all;

    limit_req zone=rp_ops burst=20 nodelay;
    client_max_body_size 0;

    location / {
        proxy_http_version 1.1;
        include snippets/retailpulse-proxy-params.conf;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_pass http://retailpulse_portainer;
        proxy_read_timeout 86400s;
        proxy_buffering off;
    }
}

# =============================================================================
# Jenkins — jenkins.example.com
# =============================================================================
server {
    listen 80;
    listen [::]:80;
    server_name jenkins.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name jenkins.example.com;

    # ssl_certificate     /etc/letsencrypt/live/jenkins.example.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/jenkins.example.com/privkey.pem;
    include snippets/retailpulse-ssl.conf;
    include snippets/retailpulse-security-headers.conf;

    # allow 203.0.113.0/24;
    # deny all;

    limit_req zone=rp_ops burst=20 nodelay;
    client_max_body_size 100m;

    location / {
        proxy_http_version 1.1;
        include snippets/retailpulse-proxy-params.conf;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        # Jenkins crumb / reverse-proxy awareness
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_pass http://retailpulse_jenkins;
        proxy_read_timeout 600s;
        proxy_request_buffering off;
    }
}

