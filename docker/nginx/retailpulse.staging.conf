# =============================================================================
# RetailPulse — STAGING Nginx site (Contabo VPS, IP-based, HTTP only)
#
# This mirrors the live staging config observed on the Contabo VPS
# (server_name = public IPv4, listen 80, no TLS yet).
#
# DO NOT replace this with the multi-domain HTTPS template
# (docker/nginx/retailpulse.conf) until a real domain + Certbot are ready.
# Overwriting the live site with hostnames that don't resolve / SSL that
# isn't issued will take the staging app offline.
#
# Install / refresh (idempotent — same shape as what's already running):
#   sudo cp docker/nginx/retailpulse.staging.conf \
#     /etc/nginx/sites-available/retailpulse
#   sudo nginx -t && sudo systemctl reload nginx
#
# Ops UIs (Portainer / Jenkins / Grafana / …) stay on 127.0.0.1 only.
# On staging without DNS, use SSH tunnels — do NOT put them on :80 under
# the same server_name until you have dedicated hostnames + auth.
# =============================================================================

map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

upstream retailpulse_app {
    server 127.0.0.1:8000;
    keepalive 32;
}

upstream retailpulse_reverb {
    server 127.0.0.1:8080;
}

server {
    listen 80;
    listen [::]:80;
    # Staging currently has no domain — use the VPS public IPv4.
    # When DNS exists, switch to erp.example.com and migrate to
    # docker/nginx/retailpulse.conf (TLS + HTTP/2 + ops vhosts).
    server_name 169.58.58.151;

    client_max_body_size 64M;

    # WebSocket / Reverb (Laravel Echo / Pusher protocol path)
    location /app/ {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_pass http://retailpulse_reverb;
        proxy_read_timeout 60s;
        # Unbuffered — required for long-lived WS (safe for Octane/Reverb)
        proxy_buffering off;
    }

    location / {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        # Keepalive to FrankenPHP/Octane — empty Connection reuses upstream
        proxy_set_header Connection "";
        proxy_pass http://retailpulse_app;
        proxy_read_timeout 120s;
    }
}
